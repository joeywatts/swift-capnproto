name: CI

on:
  push:
  pull_request:

jobs:
  swift:
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift build
      - run: swift test
      - run: Scripts/check-package-boundaries.sh
